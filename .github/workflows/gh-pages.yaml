name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

# 実行中のデプロイは中断せず、順番に処理する
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install 📦
        run: npm ci

      # lint → 単体テスト → build → 生成物の検証。失敗した場合はデプロイしない
      - name: Test and Build 🔧
        run: npm test

      - name: Upload artifact 📤
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy 🚀
        id: deployment
        uses: actions/deploy-pages@v5
